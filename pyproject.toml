[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagent-scorecard"
version = "0.1.0"
description = "A reproducible harness that scores biology AI agents on open benchmarks."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []   # The harness uses the standard library only.

[project.scripts]
bioagent-scorecard = "bioagent_scorecard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bioagent_scorecard = ["prices.json", "pins.json", "anchors.json"]
