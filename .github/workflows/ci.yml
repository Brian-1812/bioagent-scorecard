# CI: offline unit tests, then the dry run with the network blocked.
# No API keys and no model calls run here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, synthetic fixtures)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Sandbox tests as root (namespaces, uid nobody, rlimits)
        # The row-B sandbox needs root to build namespaces. As a normal user
        # these tests skip, so run them once more with sudo.
        shell: bash   # -eo pipefail: a failing test fails the step despite `tee`.
        run: |
          sudo env PYTHONPATH=src "$(command -v python)" -m unittest \
            tests.test_sandbox_and_limits.TestRealSandbox -v 2>&1 | tee sandbox-tests.txt
          if grep -q "skipped" sandbox-tests.txt; then
            echo "the sandbox tests were skipped; they must run as root here"
            exit 1
          fi

  dry-run:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the LAB-Bench SeqQA download
        uses: actions/cache@v4
        with:
          path: data/lab-bench
          key: lab-bench-seqqa-5c77cec6-v2
      - name: Install pyarrow (fetch reads the parquet file; runs do not need it)
        run: python -m pip install pyarrow
      - name: Fetch SeqQA (pinned parquet, sha256 checked, no model calls)
        env:
          PYTHONPATH: src
        run: |
          if [ ! -f data/lab-bench/SeqQA.jsonl ]; then
            python -m bioagent_scorecard fetch --subset SeqQA
          fi
      - name: Dry run with no network namespace
        shell: bash   # bash -eo pipefail: a failing dry run fails the step despite `tee`.
        # `unshare -n` gives the job a network namespace with no interfaces,
        # so even a subprocess or a C extension cannot connect. The Python
        # guard in netguard.py runs as well.
        run: |
          sudo unshare -n -- env PYTHONPATH=src PATH="$PATH" \
            bash scripts/dry_run.sh SeqQA 0 | tee dry-run.txt
      - name: Keep the run summaries (no question text)
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            dry-run.txt
            runs/dry-run/*/summary.json
            runs/dry-run/*/manifest.json
